{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Smart Delivery{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ESTILOS GENERALES -->
    <style>
        .logo-icon {
            width: 280px;
            margin: 0 auto 5px auto;
        }

        .logo-icon img {
            width: 100%;
            height: auto;
            display: block;
        }

      

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ===== PÁGINAS DE AUTENTICACIÓN ===== */
        .auth-body {
            min-height: 100vh;
            background: linear-gradient(rgba(12, 25, 68, 0.85), rgba(12, 25, 68, 0.85)),
            url("{% static 'img/truck.jpg' %}") no-repeat center center/cover;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 420px;
            padding: 40px;

            background: rgba(255, 255, 255, .92);

            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .18);

            text-align: center;
        }



        h1 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            background: #f8fafc;
            color: #1f2937;

            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            margin-top: 15px;
            background: linear-gradient(135deg, #7b2ff7, #00c6ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .link-text {
            margin-top: 15px;
            font-size: 14px;
        }

        .link-text a {
            color: #00c6ff;
            text-decoration: none;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    {% block content %}
    {% endblock %}

    {% block extra_js %}{% endblock %}

</body>

</html>
