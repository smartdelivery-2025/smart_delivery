
<div class="tabla-pedidos">



    <!-- FILTROS -->
    <div class="filters">

        <button class="filter-btn active" onclick="filterPedidos('ALL', this)">
            Todos
        </button>

        <button class="filter-btn" onclick="filterPedidos('PENDIENTE', this)">
            Pendientes
        </button>

        <button class="filter-btn" onclick="filterPedidos('EN_RUTA', this)">
            En Ruta
        </button>

        <button class="filter-btn" onclick="filterPedidos('ENTREGADO', this)">
            Entregados
        </button>

    </div>

    <!-- TABLA -->
    <table>
        <thead>
            <tr>
                <th>Pedido</th>
                <th>Destinatario</th>
                <th>Estado</th>
                <th>Conductor</th>
                <th>Peso</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr class="pedido-row" data-status="PENDIENTE">
                <td>#001</td>

                <td>
                    <span class="status pending">
                        Pendiente
                    </span>
                </td>

                <td>Sin asignar</td>

                <td>2 Kg</td>

                <td>02/06/2026</td>

                <td>
                    <button class="btn-action edit-btn">
                        <i class="fas fa-pen"></i>
                    </button>
                </td>
            </tr>

            <tr class="pedido-row" data-status="EN_RUTA">
                <td>#002</td>
                <td>María Gómez</td>

                <td>
                    <span class="status route">
                        En Ruta
                    </span>
                </td>

                <td>Carlos López</td>

                <td>5 Kg</td>

                <td>02/06/2026</td>

                <td>
                    <button class="btn-action edit-btn">
                        <i class="fas fa-pen"></i>
                    </button>
                </td>
            </tr>

            <tr class="pedido-row" data-status="ENTREGADO">
                <td>#003</td>
                <td>Carlos Rodríguez</td>

                <td>
                    <span class="status delivered">
                        Entregado
                    </span>
                </td>

                <td>Andrés Gómez</td>

</div>

<style>
    .tabla-pedidos tbody tr {
        transition: .3s;
    }

    .tabla-pedidos tbody tr:hover {
        background: rgba(255, 255, 255, .05);
    }

    .btn-action {
        margin: auto;
    }

    .tabla-pedidos {
        margin-top: 30px;
        overflow-x: auto;
    }

    .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        color: white;
        background: rgba(255, 255, 255, .08);
        transition: .3s;
    }

    .filter-btn:hover {
        background: rgba(255, 255, 255, .15);
    }

    .filter-btn.active {
        background: linear-gradient(135deg, #7b2ff7, #00c6ff);
    }

    .tabla-pedidos table {
        width: 100%;
        border-collapse: collapse;
    }

    .tabla-pedidos th,
    .tabla-pedidos td {
        padding: 15px;
        text-align: center;
        vertical-align: middle;
    }

    .tabla-pedidos th {
        font-weight: 600;
    }

    .tabla-pedidos tbody tr {
        transition: .3s;
    }

    .tabla-pedidos tbody tr:hover {
        background: rgba(255, 255, 255, .05);
    }

    .status {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        color: white;
    }

    .pending {
        background: #f59e0b;
    }

    .route {
        background: #3b82f6;
    }

    .delivered {
        background: #22c55e;
    }

    .btn-action {
        width: 40px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(255, 255, 255, .12);

        color: white;

        cursor: pointer;
        transition: .3s;
    }

    .btn-action:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, .15);
    }

    .edit-btn i {
        color: #60a5fa;
    }

    /* RESPONSIVE */

    @media (max-width:768px) {

        .tabla-pedidos table {
            min-width: 700px;
        }

        .filters {
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .filter-btn {
            white-space: nowrap;
        }

        .filter-btn.active {
            background: linear-gradient(135deg,
                    #7b2ff7,
                    #00c6ff);
        }
    }

    @media (max-width:768px) {

        .tabla-pedidos table {
            min-width: 750px;
        }

        .filters {
            overflow-x: auto;
            flex-wrap: nowrap;
        }
    }
</style>

<script>
    function filterPedidos(status, button) {

        const rows = document.querySelectorAll('.pedido-row');

        rows.forEach(row => {

            if (status === 'ALL') {
                row.style.display = '';
                return;
            }

            if (row.dataset.status === status) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }

        });

        document.querySelectorAll('.filter-btn')
            .forEach(btn => btn.classList.remove('active'));

        button.classList.add('active');
    }
</script>
